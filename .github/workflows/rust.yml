name: Corvus Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    # setup caching
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Build Application
      run: cargo build --release --verbose --target x86_64-unknown-linux-gnu --no-default-features --features lambda
    - name: Rename output
      run: mv target/x86_64-unknown-linux-gnu/release/citizen_id bootstrap
        
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lambda
        path: bootstrap
        retention-days: 14
