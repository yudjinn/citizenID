name: Corvus Backend

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

env:
  CARGO_TERM_COLOR: always
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }} 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    # setup caching
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Update dependencies
      run: cargo update
    - name: Build Application
      run: cargo build --release --verbose --target x86_64-unknown-linux-gnu --no-default-features --features lambda
    - name: Rename output
      run: mv target/x86_64-unknown-linux-gnu/release/citizen_id bootstrap && chmod +x bootstrap
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lambda
        path: bootstrap
        retention-days: 14
    - uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2
    - run: zip -j lambda.zip ./bootstrap
    # TODO: use this when staging is a real thing
    # - run: | 
    #     aws lambda update-function-code --function-name \
    #       ${{ env.BRANCH_NAME == 'main' && 'corvus-production' || env.BRANCH_NAME == 'staging' && 'corvus-staging' || 'UNKNOWN' }} \
    #       --zip-file=fileb://lambda.zip
    - run: | 
        aws lambda update-function-code --function-name \
          'corvus-staging' \
          --zip-file=fileb://lambda.zip
      
