[package]
name = "citizen_id"
version = "0.1.0"
edition = "2021"

[features]
# compile-time differences for lambda usage
tempdb = []
dynamodb = []
lambda = ["dynamodb"]
default = ["tempdb"]


[dependencies]
argon2 = "0.5.2"
aws-config = "0.56.1"
aws-sdk-dynamodb = { version = "0.33.0", features = ["rt-tokio"] }
chrono = { version = "0.4.31", features = ["serde"] }
color-eyre = "0.6.2"
hmac = { version = "0.12.1", features = ["std"] }
jwt = "0.16.0"
poem = { version = "1.3.58", features = ["session", "server"] }
poem-lambda = "1.3.58"
poem-openapi = { version = "3.0.5", features = ["swagger-ui", "uuid", "chrono"] }
reqwest = "0.11.22"
serde = { version = "1.0.190", features = ["derive"] }
serde_dynamo = { version = "4.2.7", features = ["aws-sdk-dynamodb+0_33"] }
serde_with = { version = "3.4.0", features = ["json"] }
sha2 = "0.10.8"
sqlx = {version ="0.7.2", features = ["runtime-tokio-rustls", "sqlite"]}
time = { version = "0.3.30", features = ["serde"] }
tokio = { version = "1.33.0", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = {version="0.3.17", features= ["env-filter"]}
uuid = { version = "1.5.0", features = ["serde", "v4"] }


