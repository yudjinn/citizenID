[package]
name = "citizen_id"
version = "0.2.3"
edition = "2021"

[profile.release]
strip = true

[features]
# compile-time differences for lambda usage
tempdb = []
dynamodb = []
lambda = ["dynamodb"]
default = ["dynamodb"]


[dependencies]
anyhow = "1.0.80"
argon2 = { version = "0.5.3", features = ["std"] }
aws-config = "0.56.1"
aws-sdk-dynamodb = { version = "0.33.0", features = ["rt-tokio"] }
axum = { version = "0.7.4", features = [ "macros", "multipart"] }
axum-extra = { version = "0.9.2", features = ["cookie", "cookie-key-expansion", "typed-header"] }
chrono = { version = "0.4.34", features = ["serde"] }
color-eyre = "0.6.2"
hmac = { version = "0.12.1", features = ["std"] }
http = "1.1.0"
hyper = "1.2.0"
jsonwebtoken = "9.2.0"
lambda_http = "0.10.0"
lambda_runtime = "0.10.0"
lazy_static = "1.4.0"
rand = "0.8.5"
regex = "1.10.4"
reqwest = { version = "0.11.26", features = ["json"] }
reqwest-graphql = "1.0.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_dynamo = { version = "4.2.13", features = ["aws-sdk-dynamodb+0_33"] }
serde_json = "1.0.116"
serde_with = { version = "3.6.1", features = ["json"] }
sha2 = "0.10.8"
soft-aes = "0.2.2"
strum = { version = "0.25.0", features = ["derive"] }
strum_macros = "0.25.3"
time = { version = "0.3.34", features = ["serde"] }
tokio = { version = "1.36.0", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
tracing = "0.1.40"
tracing-subscriber = {version="0.3.18", features= ["env-filter"]}
urlencoding = "2.1.3"
uuid = { version = "1.7.0", features = ["serde", "v4"] }


